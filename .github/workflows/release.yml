name: Release

# 打一个 v* 标签并推送时，自动构建、打包并创建 GitHub Release，附件是 zip。
on:
  push:
    tags:
      - "v*"

# 创建 Release 需要写仓库内容的权限；默认 token 只有读权限，必须显式声明。
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 版本号来自 package.json，tag 名与之不一致时这里会直接失败，避免发出错版本。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) 与 package.json($PKG_VERSION) 版本不一致"
            exit 1
          fi

      # 先跑一遍检查，避免把不合格的产物发出去。
      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      # 这一步同时完成构建与打 zip，产物在 release/ 下。
      - name: 构建并打包
        run: npm run package

      # 创建 Release 并附上 zip；说明由 GitHub 按提交自动生成。
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy Markdown Link</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>

  <body>
    <!-- 主卡片容器 -->
    <div class="card">
      <!-- 标题区域：标题行右侧放地球图标，副标题独占整行避免被挤断 -->
      <div class="header">
        <div class="title-row">
          <h1 class="app-title" data-i18n="appName">复制 Markdown 链接</h1>

          <div class="locale-picker">
            <button
              id="localeBtn"
              type="button"
              aria-controls="localeMenu"
              aria-expanded="false"
              data-i18n-aria-label="languageLabel"
              class="locale-btn"
            >
              <span aria-hidden="true">🌐</span>
            </button>

            <!-- 语言菜单：选项由 settingsForm.renderLocaleMenu 生成 -->
            <div
              id="localeMenu"
              role="radiogroup"
              data-i18n-aria-label="languageLabel"
              class="locale-menu hidden"
            ></div>
          </div>
        </div>

        <p class="subtitle" data-i18n="subtitle">
          一键复制当前页面的 Markdown 链接
        </p>
      </div>

      <!-- 链接格式选择区域 -->
      <div class="field field--format">
        <!-- 下拉框说明文本 -->
        <label for="format" class="field-label" data-i18n="formatLabel">
          链接格式
        </label>

        <!-- 链接格式选择器（选项由 settingsForm.renderFormatOptions 按注册表生成） -->
        <select id="format" class="field-control"></select>
      </div>

      <!-- 链接前缀 -->
      <div class="field">
        <label for="prefix" class="field-label" data-i18n="prefixLabel"
          >前缀（可选）</label
        >
        <input
          id="prefix"
          type="text"
          class="field-control"
          placeholder="例如：★ "
          data-i18n-placeholder="prefixPlaceholder"
          autocomplete="off"
        />
      </div>

      <!-- 链接后缀 -->
      <div class="field">
        <label for="suffix" class="field-label" data-i18n="suffixLabel"
          >后缀（可选）</label
        >
        <input
          id="suffix"
          type="text"
          class="field-control"
          placeholder="例如： 🔗"
          data-i18n-placeholder="suffixPlaceholder"
          autocomplete="off"
        />
      </div>

      <!-- 复制按钮、状态提示与预览：三者放在同一组，用统一的 8px 间距，避免提示上下边距一大一小 -->
      <div class="copy-group">
        <button id="copyBtn" data-i18n="copyButton" class="copy-btn">
          复制链接
        </button>

        <!-- 状态提示：role=status + aria-live 让读屏软件播报复制结果 -->
        <div
          id="status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          class="status hidden"
        ></div>

        <!-- 复制内容预览 -->
        <div id="preview" class="preview hidden"></div>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>

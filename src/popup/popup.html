<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy Markdown Link</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>

  <body class="w-72 bg-gray-100 p-3">
    <!-- 主卡片容器 -->
    <div
      class="space-y-4 rounded-xl border border-gray-200 bg-white p-4 shadow-sm"
    >
      <!-- 标题区域 -->
      <div class="space-y-0.5 px-0.5">
        <h1 class="text-sm font-semibold tracking-tight text-gray-900">
          Copy Markdown Link
        </h1>
        <p class="text-xs text-gray-500">一键复制当前页面的 Markdown 链接</p>
      </div>

      <!-- 链接格式选择区域 -->
      <div class="space-y-1">
        <!-- 下拉框说明文本 -->
        <label for="format" class="mb-1.5 block text-xs text-gray-500">
          链接格式
        </label>

        <!-- 链接格式选择器 -->
        <select
          id="format"
          class="w-full cursor-pointer rounded-md border border-gray-300 bg-white px-2 py-1.5 text-sm hover:border-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        >
          <option value="markdown">Markdown 链接 [title](url)</option>
          <option value="url">纯 URL 链接</option>
          <option value="title">仅标题</option>
        </select>
      </div>

      <!-- 链接前缀 -->
      <div class="space-y-1">
        <label for="prefix" class="block text-xs text-gray-500"
          >前缀（可选）</label
        >
        <input
          id="prefix"
          type="text"
          class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
          placeholder="例如：★ "
          autocomplete="off"
        />
      </div>

      <!-- 链接后缀 -->
      <div class="space-y-1">
        <label for="suffix" class="block text-xs text-gray-500"
          >后缀（可选）</label
        >
        <input
          id="suffix"
          type="text"
          class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
          placeholder="例如： 🔗"
          autocomplete="off"
        />
      </div>

      <!-- 复制按钮 -->
      <button
        id="copyBtn"
        class="w-full rounded-md bg-emerald-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-emerald-700 focus:ring-2 focus:ring-emerald-500 focus:ring-offset-1 focus:outline-none active:scale-[0.98] active:bg-emerald-800"
      >
        复制链接
      </button>

      <!-- 状态提示 -->
      <div id="status" class="hidden text-center text-xs text-gray-500"></div>

      <!-- 复制内容预览 -->
      <div
        id="preview"
        class="mt-2 hidden rounded-md border border-gray-200 bg-gray-50 px-2 py-1.5 font-mono text-xs leading-relaxed break-all text-gray-700"
      ></div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
